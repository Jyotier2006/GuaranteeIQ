# Requires a functioning resource Metrics API (commonly metrics-server).
# Scales static Nginx serving, not the browser Monte Carlo engine.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guaranteeiq-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: guaranteeiq-web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
